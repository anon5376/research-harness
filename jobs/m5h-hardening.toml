# Codex cloud task for briefs/M5h-hardening.md. Add it after the probe is imported, from a commit on origin/main.
# Lands before m6c-pacing and m6d-wake (all three change rh/supervisor.py).
id = "m5h-hardening"
kind = "codex-cloud"
needs = ["python", "git"]
write_paths = ["rh/contract.py", "rh/protocol.py", "rh/collect.py", "rh/supervisor.py", "rh/cli.py", "tests/test_hardening.py"]
timeout_min = 120
brief = """Implement briefs/M5h-hardening.md exactly. Its interface rules are binding: do not rename, re-sign or move
anything, change no existing test, and write only the files it lists plus runs/m5h-hardening/. Follow
briefs/README.md for the inherited rules (stack line first, gates in runs/m5h-hardening/GATES.md, the whole suite
must pass). Write runs/m5h-hardening/SUMMARY.md with the stack line, the exact test command and its real result."""
accept = "python3 -I tests/run.py"

[model]
requested = "gpt-6-astra"
speed = "fast"
effort = "ultra"
