# Codex cloud task for briefs/M7b-serve.md. First job of the long-lived desktop task, once m6a has landed and the rh serve hook is on origin/main.
id = "m7b-serve"
kind = "codex-cloud"
needs = ["python", "git"]
write_paths = ["rh/serve.py", "tests/test_serve.py"]
timeout_min = 180
brief = """Implement briefs/M7b-serve.md exactly. Its interface section is binding: do not rename, re-sign or move
anything it names, and write only the files it lists plus runs/m7b-serve/. Follow briefs/README.md for the inherited
rules (stack line first, gates in runs/m7b-serve/GATES.md, the whole suite must pass). Write runs/m7b-serve/SUMMARY.md with
the stack line, the exact test command and its real result."""
accept = "python3 -I tests/run.py"

[model]
requested = "gpt-6.1-sol"
speed = "standard"
effort = "extra-high"
