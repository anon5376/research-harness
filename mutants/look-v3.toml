# Look v3: each mutant breaks one claim the new look makes, and the named tests must catch it.

[[mutant]]
name = "the serif route serves the mono file"
file = "rh/serve.py"
find = '_FONTS = {f"/fonts/{name}": dashboard._WEB / "fonts" / name for name in dashboard.FONTS}'
replace = '_FONTS = {f"/fonts/{name}": dashboard._WEB / "fonts" / dashboard.FONTS[1] for name in dashboard.FONTS}'
tests = ["tests.test_serve.ServeTest.test_fonts_come_from_the_repo_and_nothing_else_is_served_beside_them"]

[[mutant]]
name = "every file in the font folder is served"
file = "rh/serve.py"
find = '_FONTS = {f"/fonts/{name}": dashboard._WEB / "fonts" / name for name in dashboard.FONTS}'
replace = '_FONTS = {f"/fonts/{p.name}": p for p in (dashboard._WEB / "fonts").iterdir()}'
tests = ["tests.test_serve.ServeTest.test_fonts_come_from_the_repo_and_nothing_else_is_served_beside_them"]

[[mutant]]
name = "the page names a face the server does not serve"
file = "rh/dashboard.py"
find = "src:url(/fonts/GeistSerif-Square.woff2)"
replace = "src:url(/fonts/GeistSerif.woff2)"
tests = ["tests.test_serve.ServeTest.test_fonts_come_from_the_repo_and_nothing_else_is_served_beside_them"]

[[mutant]]
name = "the snapshot asks for the fonts too"
file = "rh/dashboard.py"
find = '        head, extra, style = "", "", STYLE'
replace = '        head, extra, style = "", "", _FACES + STYLE'
tests = ["tests.test_dashboard.DashboardTest.test_self_contained_document"]

[[mutant]]
name = "the policy lets fonts load from anywhere"
file = "rh/serve.py"
find = "font-src 'self'"
replace = "font-src *"
tests = ["tests.test_serve.ServeTest.test_every_response_carries_the_security_headers_and_app_js_needs_no_token"]

[[mutant]]
name = "faint text falls under 4.5:1"
file = "rh/web/rh.css"
find = "--faint: #808b88;"
replace = "--faint: #6c7673;"
tests = ["tests.test_dashboard.DashboardTest.test_text_contrast_on_the_dark_surfaces"]

[[mutant]]
name = "a failure is drawn in teal"
file = "rh/dashboard.py"
find = '**{s: ("failed", "red") for s in _FAILED}'
replace = '**{s: ("failed", "accent") for s in _FAILED}'
tests = ["tests.test_dashboard.DashboardTest.test_a_ring_names_each_state_in_its_hue"]

[[mutant]]
name = "checking the result looks like running"
file = "rh/dashboard.py"
find = '"collecting": ("three", "accent")'
replace = '"collecting": ("half", "accent")'
tests = ["tests.test_dashboard.DashboardTest.test_a_ring_names_each_state_in_its_hue"]

[[mutant]]
name = "a seat waiting on you is drawn teal"
file = "rh/dashboard.py"
find = '        return "amber", "waiting on you", waiting[0], len(working)'
replace = '        return "accent", "waiting on you", waiting[0], len(working)'
tests = ["tests.test_dashboard.DashboardTest.test_each_seat_is_a_jellyfish_in_the_colour_of_what_it_is_doing"]

[[mutant]]
name = "an idle seat is drawn lit"
file = "rh/dashboard.py"
find = '"alpha": 0.55 if faint else 1'
replace = '"alpha": 1'
tests = ["tests.test_dashboard.DashboardTest.test_each_seat_is_a_jellyfish_in_the_colour_of_what_it_is_doing"]

[[mutant]]
name = "the tank keeps swimming under reduced motion"
