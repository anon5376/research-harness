replace = "  if (false) { draw(6); return; }"
tests = ["tests.test_dashboard.DashboardTest.test_each_seat_is_a_jellyfish_in_the_colour_of_what_it_is_doing"]

[[mutant]]
name = "the palette offers every action on every page"
