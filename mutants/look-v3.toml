find = "    acts = [(k, word, sub) for k, word, sub in _PRESS if k in keys]"
replace = "    acts = list(_PRESS)"
tests = ["tests.test_dashboard.DashboardTest.test_palette_finds_every_job_every_page_and_only_this_pages_actions"]

[[mutant]]
name = "the palette drops the first job"
