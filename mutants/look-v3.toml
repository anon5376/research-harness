find = "                    status = 404"
replace = "                    status = 200"
tests = ["tests.test_serve.ServeTest.test_inbox_opens_on_the_newest_item_and_each_item_has_its_own_address"]

[[mutant]]
name = "any path under /inbox is a way back"
file = "rh/serve.py"
find = '    if re.fullmatch(r"/inbox/[0-9]{1,12}", target):'
replace = '    if target.startswith("/inbox/"):'
tests = ["tests.test_serve.ServeTest.test_forms_return_to_the_page_they_came_from_and_nowhere_else"]

[[mutant]]
name = "forms on the Inbox lose their way back"
file = "rh/dashboard.py"
find = '    ctx["back"] = "/inbox"'
replace = '    ctx["back"] = None'
tests = ["tests.test_dashboard.DashboardTest.test_live_forms_cover_every_route"]

[[mutant]]
name = "heavy work is offered over the load limit"
file = "rh/serve.py"
find = "    ok, reason = lease.admit(reading, limit)"
replace = "    ok, reason = lease.admit(reading, limit * 2)"
tests = ["tests.test_serve.ServeTest.test_this_mac_and_the_seats_come_from_the_lease_and_seats_toml"]

[[mutant]]
name = "an unreadable host breaks the page"
file = "rh/serve.py"
find = "    except Exception as error:  # noqa: BLE001  (a host that cannot be read must not break the page)"
replace = "    except ValueError as error:"
tests = ["tests.test_serve.ServeTest.test_this_mac_and_the_seats_come_from_the_lease_and_seats_toml"]

[[mutant]]
name = "a broken seats.toml breaks the page"
file = "rh/serve.py"
find = "    except (OSError, ValueError):"
replace = "    except OSError:"
tests = ["tests.test_serve.ServeTest.test_this_mac_and_the_seats_come_from_the_lease_and_seats_toml"]

[[mutant]]
name = "This Mac says heavy jobs may start while they must wait"
file = "rh/dashboard.py"
find = '"may start" if ok else "wait"'
replace = '"may start"'
tests = ["tests.test_dashboard.DashboardTest.test_this_mac_says_whether_a_heavy_step_may_start"]

[[mutant]]
name = "a finished job never moves to Earlier"
file = "rh/dashboard.py"
find = 'self.group = "earlier" if _number(ended) and ended < ctx["midnight"] else "ended"'
replace = 'self.group = "ended"'
tests = ["tests.test_dashboard.DashboardTest.test_a_failure_needs_you_until_it_is_run_again_or_a_day_passes"]

[[mutant]]
name = "the client selects a group the page does not render"
file = "rh/web/app.js"
find = "'.s-g-live'"
replace = "'.s-g-running'"
tests = ["tests.test_dashboard.DashboardTest.test_every_class_the_script_selects_is_in_the_page"]

