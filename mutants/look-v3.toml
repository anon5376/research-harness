# Look v3: each mutant breaks one claim the new look makes, and the named tests must catch it.

[[mutant]]
name = "the serif route serves the mono file"
file = "rh/serve.py"
find = '_FONTS = {f"/fonts/{name}": dashboard._WEB / "fonts" / name for name in dashboard.FONTS}'
replace = '_FONTS = {f"/fonts/{name}": dashboard._WEB / "fonts" / dashboard.FONTS[1] for name in dashboard.FONTS}'
tests = ["tests.test_serve.ServeTest.test_fonts_come_from_the_repo_and_nothing_else_is_served_beside_them"]

[[mutant]]
name = "every file in the font folder is served"
file = "rh/serve.py"
