find = "    for j in sorted(jobs, key=lambda j: order[j.group]):"
replace = "    for j in sorted(jobs, key=lambda j: order[j.group])[1:]:"
tests = ["tests.test_dashboard.DashboardTest.test_palette_finds_every_job_every_page_and_only_this_pages_actions"]

