# The sea's cells: each mutant brings back a way a strip's creatures ran together or flattened, or characters that do
# not fit their cells, and the named test must catch it. (The dot-size mutants left with the dots, when the sea moved
# to characters.)

[[mutant]]
name = "rows stretch to fill the strip's height"
file = "rh/web/app.js"
find = "  const P = seaPitch(W, H, n, sea), Q = P * LATTICE;"
replace = "  const P = seaPitch(W, H, n, sea), Q = H / Math.max(1, Math.floor(H / (P * LATTICE)));"
tests = ["tests.test_dashboard.DashboardTest.test_the_seas_characters_fit_their_cells"]

[[mutant]]
name = "square cells: the row pitch is the column pitch"
file = "rh/web/app.js"
find = "  const P = seaPitch(W, H, n, sea), Q = P * LATTICE;"
replace = "  const P = seaPitch(W, H, n, sea), Q = P;"
tests = ["tests.test_dashboard.DashboardTest.test_the_seas_characters_fit_their_cells"]

[[mutant]]
name = "characters wider than their column run together"
file = "rh/web/app.js"
find = "const glyphSize = (P, Q) => Math.min(Q * 0.9, P * 0.95 / ADVANCE);"
replace = "const glyphSize = (P, Q) => Q * 0.9;"
tests = ["tests.test_dashboard.DashboardTest.test_the_seas_characters_fit_their_cells"]

[[mutant]]
name = "characters too small to read beside the list"
file = "rh/web/app.js"
find = "const glyphSize = (P, Q) => Math.min(Q * 0.9, P * 0.95 / ADVANCE);"
replace = "const glyphSize = (P, Q) => Math.min(Q * 0.6, P * 0.95 / ADVANCE);"
tests = ["tests.test_dashboard.DashboardTest.test_the_seas_characters_fit_their_cells"]

[[mutant]]
name = "specks of plankton as wide as their column"
file = "rh/web/app.js"
find = "const speck = P => Math.max(0.8, P * 0.16);"
replace = "const speck = P => P * 0.5;"
tests = ["tests.test_dashboard.DashboardTest.test_the_seas_characters_fit_their_cells"]
