find = "  if (form) { clearTimeout(form.shut); form.dataset.open = ''; }"
replace = "  if (form) clearTimeout(form.shut);"
tests = ["tests.test_dashboard.DashboardTest.test_today_opens_on_what_needs_you"]

[[mutant]]
