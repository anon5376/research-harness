file = "rh/dashboard.py"
find = '''    if m and str(code) == "1":'''
replace = '''    if m:'''
tests = ["tests.test_dashboard.DashboardTest.test_finished_pages_lead_with_the_result_and_fold_the_log"]

[[mutant]]
name = "the waiting job's page offers only the hand launch"
file = "rh/dashboard.py"
find = '''        act = (_acts([choose, _button(ctx, "/handoff"'''
replace = '''        act = (_acts([_button(ctx, "/handoff"'''
tests = ["tests.test_dashboard.DashboardTest.test_unseen_environment_is_one_row_and_its_jobs_offer_a_hand_launch_that_says_why"]

[[mutant]]
name = "the brief shares its line with the composer's controls again"
file = "rh/web/rh.css"
find = '''.compose.composer { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "text" "cmd" "row";'''
replace = '''.compose.composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "text row" "cmd cmd";'''
tests = ["tests.test_dashboard.DashboardTest.test_today_opens_on_what_needs_you"]

[[mutant]]
name = "the send arrow is lit with nothing to send"
file = "rh/web/rh.css"
find = ".composer:has(.c-text:placeholder-shown) .send { background: var(--raised); border-color: var(--control); }"
replace = ".composer:has(.c-text:placeholder-shown) .send { background: var(--text); border-color: var(--text); }"
tests = ["tests.test_dashboard.DashboardTest.test_today_opens_on_what_needs_you"]

[[mutant]]
name = "a long title is cut in the list"
file = "rh/web/rh.css"
find = ".row .name { grid-column: 2; grid-row: 1; color: var(--text); line-height: 20px; overflow-wrap: anywhere; }"
replace = ".row .name { grid-column: 2; grid-row: 1; color: var(--text); line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }"
tests = ["tests.test_dashboard.DashboardTest.test_today_opens_on_what_needs_you"]

[[mutant]]
name = "below 1180 px the sea keeps a column beside the list"
file = "rh/web/rh.css"
find = "  .reef-page { grid-template-columns: minmax(0, 1fr); }  /* the sea leaves"
replace = "  .reef-page { grid-template-columns: minmax(0, 1fr) 248px; }  /* the sea leaves"
tests = ["tests.test_dashboard.DashboardTest.test_today_opens_on_what_needs_you"]

[[mutant]]
name = "the phone's composer shows all its controls before it is used"
file = "rh/web/rh.css"
find = "  .c-strip .composer:not(:focus-within):not([data-open]):has(.c-text:placeholder-shown) > :is(.c-row, .cmd) { display: none; }"
replace = ""
tests = ["tests.test_dashboard.DashboardTest.test_today_opens_on_what_needs_you"]

[[mutant]]
name = "the phone's composer folds the moment focus leaves it"
