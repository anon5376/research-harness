# v5.1: each mutant breaks one claim of look v5.1 (one row per repeated failure, the brief's whole width, the sea under
# the list below 1180 px, the failed check said in words, Choose environment on the waiting job's page, the Inbox led
# by the job's title, bigger creatures in the open water, one left edge for the check loop), and the named tests must
# catch it.

[[mutant]]
name = "every run of a repeated failure is its own row again"
file = "rh/dashboard.py"
find = "        if same in repeats:"
replace = "        if False:"
tests = ["tests.test_dashboard.DashboardTest.test_a_failure_repeated_by_its_brief_is_one_row_until_it_is_run_again"]

[[mutant]]
name = "a repeated failure's row does not say how many times"
file = "rh/dashboard.py"
find = '''            word = f"{self.word} {runs} times" if runs > 1 else self.word'''
replace = '''            word = self.word'''
tests = ["tests.test_dashboard.DashboardTest.test_a_failure_repeated_by_its_brief_is_one_row_until_it_is_run_again"]

[[mutant]]
name = "runs that failed different ways are one row"
file = "rh/dashboard.py"
find = '''        same = (job.brief, _plain(job.row.get("detail"))) if job.failure and job.count == 1 and job.brief else None'''
replace = '''        same = (job.brief,) if job.failure and job.count == 1 and job.brief else None'''
tests = ["tests.test_dashboard.DashboardTest.test_a_failure_repeated_by_its_brief_is_one_row_until_it_is_run_again"]

[[mutant]]
name = "a repeated failure's row is for its oldest run"
file = "rh/dashboard.py"
find = '''                          reverse=True)'''
replace = '''                          reverse=False)'''
tests = ["tests.test_dashboard.DashboardTest.test_a_failure_repeated_by_its_brief_is_one_row_until_it_is_run_again"]

[[mutant]]
name = "running the newest run again leaves the older runs waiting"
file = "rh/dashboard.py"
find = '''                        and not (_number(rerun) and _number(made) and made <= rerun)'''
replace = ''''''
tests = ["tests.test_dashboard.DashboardTest.test_a_failure_repeated_by_its_brief_is_one_row_until_it_is_run_again"]

[[mutant]]
name = "running an older run again settles the newer runs too"
file = "rh/dashboard.py"
find = '''                        and not (_number(rerun) and _number(made) and made <= rerun)'''
replace = '''                        and not (_number(rerun) and _number(made))'''
tests = ["tests.test_dashboard.DashboardTest.test_a_failure_repeated_by_its_brief_is_one_row_until_it_is_run_again"]

[[mutant]]
name = "a run's page does not name the other runs"
file = "rh/dashboard.py"
find = '''    if len(runs) > 1:
        named'''
replace = '''    if False:
        named'''
tests = ["tests.test_dashboard.DashboardTest.test_a_failure_repeated_by_its_brief_is_one_row_until_it_is_run_again"]

[[mutant]]
name = "the Inbox row leads with what it needs, not the job's title"
file = "rh/dashboard.py"
find = '''    head = job.title if job else entry["ask"]'''
replace = '''    head = entry["ask"]'''
tests = ["tests.test_dashboard.DashboardTest.test_a_failure_repeated_by_its_brief_is_one_row_until_it_is_run_again"]

