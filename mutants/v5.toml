# v5: each mutant breaks one claim of look v5 (a compact Today, the sea beside the list, one word for a job held for
# its environment, the failed check first), and the named tests must catch it.

[[mutant]]
name = "the composer stops being the only thing above Needs you"
file = "rh/dashboard.py"
find = '''    return (_top(ctx, when, _tally(ctx, jobs)) + feedback + f'<div class="page reef-page"><div class="center">{strip}'
            f'<section class="jobs" aria-label="Jobs">{listed}</section></div>{_reef(ctx, view, jobs)}</div>')'''
replace = '''    return (_top(ctx, when, _tally(ctx, jobs)) + feedback + f'<div class="page reef-page"><div class="center">{strip}'
            f'{_reef(ctx, view, jobs)}<section class="jobs" aria-label="Jobs">{listed}</section></div></div>')'''
tests = ["tests.test_dashboard.DashboardTest.test_today_opens_on_what_needs_you"]

[[mutant]]
name = "the composer opens three lines tall"
file = "rh/dashboard.py"
find = '''id="brief" name="brief" rows="1" required'''
replace = '''id="brief" name="brief" rows="3" required'''
tests = ["tests.test_dashboard.DashboardTest.test_today_opens_on_what_needs_you"]

