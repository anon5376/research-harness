# Anchor seats: one role, one model and one effort each, never changed. Jobs go to a seat as follow-up turns in
# its standing task. A job's write paths stay inside its seat's `owns`; no two seats own the same path.
# Which task a seat runs in is runtime state and lives in the ledger, never here.

[seat.backend]
role = "Back end: supervisor, ledger, lease, collection, adapters"
route = "codex-cloud"
model = "gpt-6.1-sol"
effort = "max"
owns = ["rh/supervisor.py", "rh/ledger.py", "rh/lease.py", "rh/oslock.py", "rh/collect.py", "rh/config.py",
        "rh/notify.py", "rh/adapters/", ".github/workflows/ci.yml", "tests/fakes/", "tests/test_supervisor.py",
        "tests/test_ledger.py", "tests/test_lease.py", "tests/test_collect.py", "tests/test_notify.py",
        "tests/test_codex_cloud.py", "tests/test_hardening.py", "tests/test_oslock.py", "tests/test_pacing.py",
        "tests/test_wake.py"]
done = "the job's brief is met and python3 -I tests/run.py passes on the lead's machine"

[seat.cli]
role = "CLI and contracts: commands, preflight, prompts, goals, bundles, privacy, seats"
route = "codex-cloud"
model = "gpt-6.1-sol"
effort = "max"
owns = ["rh/cli.py", "rh/contract.py", "rh/protocol.py", "rh/goals.py", "rh/bundle.py", "rh/privacy.py",
        "rh/envspec.py", "rh/gitx.py", "rh/seats.py", "rh/__main__.py", "tests/test_cli.py", "tests/test_contract.py",
        "tests/test_protocol.py", "tests/test_goals.py", "tests/test_bundle.py", "tests/test_privacy.py",
        "tests/test_envspec.py", "tests/test_seats.py"]
done = "the job's brief is met and python3 -I tests/run.py passes on the lead's machine"

[seat.app]
role = "Desktop and release: rh serve, the desktop app, packaging and the release build"
route = "codex-cloud"
model = "gpt-6.1-sol"
effort = "max"
owns = ["rh/serve.py", "desktop/", ".github/workflows/build.yml", "docs/releases/", "tests/test_serve.py",
        "tests/test_desktop.py"]
done = "the job's brief is met and python3 -I tests/run.py passes on the lead's machine"

[seat.testing]
role = "Testing: the test runner and the mutant runner"
route = "codex-cloud"
model = "gpt-6.1-terra"
effort = "max"
owns = ["tests/run.py", "tests/__init__.py", "tools/", "tests/test_mutants.py"]
done = "the job's brief is met and python3 -I tests/run.py passes on the lead's machine"

[seat.design]
role = "Design: the look of every page and the app icon (Claude)"
route = "claude"
model = "claude-opus-5-5"
effort = "default"
owns = ["rh/dashboard.py", "tests/test_dashboard.py", "desktop/icons/"]
done = "existing tests stay green; no scripts, no external URLs; light and dark; no horizontal scroll at 375 px"

[seat.lead]
role = "Lead: plans, briefs, interfaces, harvest, one local check, land, release (Claude, this repo's lead session)"
route = "claude"
model = "claude-opus-5-5"
effort = "default"
owns = ["briefs/", "jobs/", "goals/", "mutants/", "skills/", "seats.toml", "policy.toml", "caps.toml", "README.md",
        "DESIGN.md", "rh/__init__.py"]
done = "each landed job has passed python3 -I tests/run.py here and its mutants file is all killed"
